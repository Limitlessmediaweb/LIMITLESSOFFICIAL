  <text x="540" y="30" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#bcd6da">Home</text>
  <text x="590" y="30" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#bcd6da">Camere</text>
  <text x="650" y="30" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#bcd6da">Contatti</text>
  <text x="540" y="48" font-family="'Trebuchet MS', sans-serif" font-size="10" fill="#9dc2c7">Tel: 0000 000000</text>

  <rect x="24" y="100" width="752" height="180" fill="#cfe0e3"/>
  <text x="400" y="195" font-family="'Trebuchet MS', sans-serif" font-size="14" fill="#4f7f86" text-anchor="middle">[ una sola foto di repertorio ]</text>

  <text x="24" y="320" font-family="'Trebuchet MS', sans-serif" font-size="18" fill="#274c52">Benvenuti</text>
  <rect x="24" y="336" width="360" height="10" fill="#cfe0e3"/>
  <rect x="24" y="354" width="330" height="10" fill="#cfe0e3"/>
  <rect x="24" y="372" width="300" height="10" fill="#cfe0e3"/>

  <rect x="24" y="404" width="160" height="34" fill="#2f5f66"/>
  <text x="104" y="426" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#e6eef0" text-anchor="middle">SCRIVI UNA EMAIL</text>

  <rect x="420" y="320" width="356" height="118" fill="none" stroke="#a9cbcf" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="598" y="384" font-family="'Trebuchet MS', sans-serif" font-size="13" fill="#4f7f86" text-anchor="middle">nessuna galleria camere</text>
  <text x="598" y="402" font-family="'Trebuchet MS', sans-serif" font-size="13" fill="#4f7f86" text-anchor="middle">prenotazione solo via email</text>

  <rect x="0" y="470" width="800" height="30" fill="#2f5f66"/>
  <text x="400" y="490" font-family="'Trebuchet MS', sans-serif" font-size="11" fill="#bcd6da" text-anchor="middle">© Sito realizzato anni fa — non ottimizzato per mobile</text>
</svg>
