<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esempio illustrativo di un sito datato per un hotel: layout generico, nessuna galleria camere, prenotazione solo via email">
  <rect width="800" height="500" fill="#e6eef0"/>
  <rect width="800" height="70" fill="#2f5f66"/>
