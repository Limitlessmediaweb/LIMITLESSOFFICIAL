  <rect x="420" y="320" width="356" height="118" fill="none" stroke="#c9a67e" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="475" y="368" font-family="Arial" font-size="13" fill="#8c5a3c">📄</text>
  <text x="598" y="384" font-family="Arial" font-size="13" fill="#8c5a3c" text-anchor="middle">menu solo in PDF</text>
  <text x="598" y="402" font-family="Arial" font-size="13" fill="#8c5a3c" text-anchor="middle">prenotazione solo telefonica</text>

  <rect x="0" y="470" width="800" height="30" fill="#8c3f2d"/>
  <text x="400" y="490" font-family="Arial" font-size="11" fill="#f0d9cc" text-anchor="middle">© Sito realizzato anni fa — non ottimizzato per mobile</text>
