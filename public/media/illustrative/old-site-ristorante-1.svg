<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esempio illustrativo di un sito datato per un ristorante: layout generico, menu solo in PDF, nessuna prenotazione">
  <rect width="800" height="500" fill="#f4ece0"/>
  <rect width="800" height="70" fill="#8c3f2d"/>
  <text x="24" y="44" font-family="'Times New Roman', serif" font-size="26" fill="#f4ece0">Ristorante</text>
  <text x="560" y="30" font-family="'Times New Roman', serif" font-size="12" fill="#f0d9cc">Home</text>
  <text x="610" y="30" font-family="'Times New Roman', serif" font-size="12" fill="#f0d9cc">Menu</text>
  <text x="662" y="30" font-family="'Times New Roman', serif" font-size="12" fill="#f0d9cc">Contatti</text>
  <text x="560" y="48" font-family="Arial" font-size="10" fill="#e3bfab">Tel: 0000 000000</text>

  <rect x="24" y="100" width="752" height="180" fill="#e9d4bd"/>
  <text x="400" y="195" font-family="Arial" font-size="14" fill="#8c5a3c" text-anchor="middle">[ nessuna foto dei piatti ]</text>

  <text x="24" y="320" font-family="'Times New Roman', serif" font-size="18" fill="#6e3322">Benvenuti</text>
  <rect x="24" y="336" width="360" height="10" fill="#e9d4bd"/>
  <rect x="24" y="354" width="330" height="10" fill="#e9d4bd"/>
  <rect x="24" y="372" width="300" height="10" fill="#e9d4bd"/>

  <rect x="24" y="404" width="150" height="34" fill="#8c3f2d"/>
