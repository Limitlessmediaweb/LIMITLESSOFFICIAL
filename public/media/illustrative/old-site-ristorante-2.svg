<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esempio illustrativo di un sito datato per un ristorante: layout generico, menu non aggiornato, nessuna foto dei piatti">
  <rect width="800" height="500" fill="#eef0ea"/>
