  <text x="560" y="30" font-family="Verdana, sans-serif" font-size="11" fill="#d3dac6">Home</text>
  <text x="605" y="30" font-family="Verdana, sans-serif" font-size="11" fill="#d3dac6">Il Menu</text>
  <text x="660" y="30" font-family="Verdana, sans-serif" font-size="11" fill="#d3dac6">Dove Siamo</text>
  <text x="560" y="48" font-family="Verdana, sans-serif" font-size="9" fill="#b7c1a4">Tel: 0000 000000</text>

  <rect x="24" y="100" width="752" height="180" fill="#dde2d3"/>
  <text x="400" y="195" font-family="Verdana, sans-serif" font-size="13" fill="#6b7860" text-anchor="middle">[ nessuna foto dei piatti ]</text>

  <text x="24" y="320" font-family="Verdana, sans-serif" font-size="16" fill="#465239">Benvenuti</text>
  <rect x="24" y="336" width="360" height="10" fill="#dde2d3"/>
  <rect x="24" y="354" width="330" height="10" fill="#dde2d3"/>
  <rect x="24" y="372" width="300" height="10" fill="#dde2d3"/>

  <rect x="24" y="404" width="150" height="34" fill="#5c6b4f"/>
  <text x="99" y="426" font-family="Verdana, sans-serif" font-size="11" fill="#eef0ea" text-anchor="middle">CHIAMA ORA</text>

  <rect x="420" y="320" width="356" height="118" fill="none" stroke="#c1c9b3" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="598" y="384" font-family="Verdana, sans-serif" font-size="12" fill="#6b7860" text-anchor="middle">menu non aggiornato da anni</text>
  <text x="598" y="402" font-family="Verdana, sans-serif" font-size="12" fill="#6b7860" text-anchor="middle">nessun video del locale</text>

  <rect x="0" y="470" width="800" height="30" fill="#5c6b4f"/>
  <text x="400" y="490" font-family="Verdana, sans-serif" font-size="10" fill="#d3dac6" text-anchor="middle">© Sito realizzato anni fa — non ottimizzato per mobile</text>
